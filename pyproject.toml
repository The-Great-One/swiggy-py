[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "swiggy-py"
version = "0.1.0"
description = "Unofficial read-only Python client for Swiggy Dineout"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "The-Great-One" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "typer>=0.12,<1",
]

[project.scripts]
swiggy = "swiggy.cli:app"

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build]
artifacts = ["src/swiggy/_endpoint_registry.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/swiggy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
